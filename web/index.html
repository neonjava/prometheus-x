<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prometheus-X | Defect Detection</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <svg class="leaf leaf-a" viewBox="0 0 120 120" aria-hidden="true"><use href="#leaf"/></svg>
  <svg class="leaf leaf-b" viewBox="0 0 120 120" aria-hidden="true"><use href="#leaf"/></svg>
  <svg class="leaf leaf-c" viewBox="0 0 120 120" aria-hidden="true"><use href="#leaf"/></svg>
  <svg class="leaf leaf-d" viewBox="0 0 120 120" aria-hidden="true"><use href="#leaf"/></svg>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="leaf" viewBox="0 0 120 120">
      <path d="M12 108C12 52 52 12 108 12c0 56-40 96-96 96z" fill="currentColor"/>
      <path d="M12 108L86 34" stroke="#f1f8f2" stroke-width="3" stroke-linecap="round" fill="none" opacity=".55"/>
    </symbol>
  </svg>

  <header>
    <svg class="logo" viewBox="0 0 120 120" aria-hidden="true"><use href="#leaf"/></svg>
    <div>
      <h1>Prometheus-X</h1>
      <p>Photo &rarr; quick check &rarr; closer look &rarr; a person decides. Trained on good images only.</p>
    </div>
  </header>

  <main>
    <div class="stack">
      <section class="card">
        <h2>Add image</h2>
        <form id="upload-form">
          <div id="drop-zone">Click or drop a product photo here</div>
          <input type="file" id="image-input" name="image" accept="image/*" required>
          <button type="submit" class="primary" id="submit-btn">Check image</button>
        </form>
        <div id="preview-wrap"><img id="preview" alt="Uploaded product"><canvas id="heat"></canvas></div>
        <label id="heat-toggle"><input type="checkbox" id="heat-check" checked> show where (heatmap)</label>
        <div id="error"></div>
      </section>

      <section class="card" id="result">
        <h2>Result</h2>
        <div class="banner" id="banner"></div>
        <div class="shift" id="shift"></div>
        <div class="rows" id="rows"></div>
        <div id="review">
          <p>Step 3: the two checks disagree. A person decides:</p>
          <div class="actions">
            <button type="button" data-decision="ok">OK</button>
            <button type="button" data-decision="reject">Reject</button>
            <button type="button" data-decision="fix">Fix</button>
          </div>
          <div id="saved"></div>
        </div>
      </section>
    </div>

    <section class="card">
      <h2>Console</h2>
      <div id="console"><span class="t">Waiting for an image&hellip;</span></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
