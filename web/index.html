<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prometheus-X Defect Detection</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 640px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
      color: #222;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    button {
      cursor: pointer;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      align-self: flex-start;
    }
    #preview-container {
      margin-top: 1rem;
    }
    #preview {
      max-width: 100%;
      max-height: 360px;
      border: 1px solid #ccc;
      border-radius: 4px;
      display: none;
    }
    #result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 4px;
      background: #f4f4f4;
      display: none;
    }
    #error {
      margin-top: 1rem;
      padding: 0.75rem;
      color: #721c24;
      background-color: #f8d7da;
      border-radius: 4px;
      display: none;
    }
    .metric {
      margin: 0.5rem 0;
    }
    .metric strong {
      display: inline-block;
      width: 80px;
    }
  </style>
</head>
<body>
  <h1>Prometheus-X Defect Detection</h1>

  <form id="upload-form">
    <label for="image-input">Select an image to inspect:</label>
    <input type="file" id="image-input" name="image" accept="image/*" required>
    <button type="submit" id="submit-btn">Run Predict</button>
  </form>

  <div id="error"></div>

  <div id="preview-container">
    <img id="preview" alt="Uploaded preview">
  </div>

  <div id="result">
    <h2>Prediction Result</h2>
    <div class="metric"><strong>Verdict:</strong> <span id="verdict"></span></div>
    <div class="metric"><strong>Score:</strong> <span id="score"></span></div>
  </div>

  <script>
    const form = document.getElementById('upload-form');
    const imageInput = document.getElementById('image-input');
    const preview = document.getElementById('preview');
    const resultBox = document.getElementById('result');
    const verdictSpan = document.getElementById('verdict');
    const scoreSpan = document.getElementById('score');
    const errorBox = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');

    // Show local preview immediately upon file selection.
    imageInput.addEventListener('change', () => {
      errorBox.style.display = 'none';
      const file = imageInput.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      } else {
        preview.src = '';
        preview.style.display = 'none';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      resultBox.style.display = 'none';

      const file = imageInput.files[0];
      if (!file) {
        return;
      }

      const formData = new FormData();
      formData.append('image', file);

      submitBtn.disabled = true;
      submitBtn.textContent = 'Predicting...';

      try {
        // Send image to predict endpoint using relative URL.
        const res = await fetch('/predict', {
          method: 'POST',
          body: formData,
        });

        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`Server returned ${res.status}: ${errText}`);
        }

        const data = await res.json();
        verdictSpan.textContent = data.verdict;
        scoreSpan.textContent = data.score;
        resultBox.style.display = 'block';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Run Predict';
      }
    });
  </script>
</body>
</html>
