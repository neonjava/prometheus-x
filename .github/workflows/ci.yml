name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Rust workspace
        id: rust
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.rust.outputs.present == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.rust.outputs.present == 'true'
      - name: fmt
        if: steps.rust.outputs.present == 'true'
        run: cargo fmt --all --check
      - name: clippy
        if: steps.rust.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
      - name: build
        if: steps.rust.outputs.present == 'true'
        run: cargo build --workspace --release --locked
      - name: test
        if: steps.rust.outputs.present == 'true'
        run: cargo test --workspace --locked
      - name: Collect binaries
        if: steps.rust.outputs.present == 'true'
        run: |
          mkdir dist
          find target/release -maxdepth 1 -type f -executable -exec cp {} dist/ \;
      - uses: actions/upload-artifact@v4
        if: steps.rust.outputs.present == 'true'
        with:
          name: prometheus-x-linux
          path: dist/
          retention-days: 7
          if-no-files-found: warn
