# Every tunable value lives here. Paths are relative to the project root.
model_weights_path = "models/resnet18.safetensors"
input_size = 224
good_vectors_path = "models/good_vectors.json"
train_dir = "data/visa_pcb1/train/good"
val_dir = "data/visa_pcb1/val/good"
test_dir = "data/visa_pcb1/test"
threshold_percentile = 80.0
uncertain_margin = 0.1
server_bind = "127.0.0.1:8080"
max_upload_bytes = 20971520
device = "cpu"
patch_bank_path = "models/patch_bank.safetensors"
patch_bank_size = 30000
patch_seed = 42
shift_percentile = 99.0
severity_low_max = 1.0
severity_med_max = 3.0
decisions_path = "data/decisions.jsonl"
robustness_sample = 50

# Photo changes used by `prometheus-x robustness`.
[[perturbations]]
name = "darker"
kind = "brightness"
amount = -60.0

[[perturbations]]
name = "brighter"
kind = "brightness"
amount = 60.0

[[perturbations]]
name = "low contrast"
kind = "contrast"
amount = -40.0

[[perturbations]]
name = "blurry"
kind = "blur"
amount = 3.0

[[perturbations]]
name = "colour cast"
kind = "hue"
amount = 40.0
