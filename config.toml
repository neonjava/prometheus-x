# Every tunable value lives here. Paths are relative to the project root.
model_weights_path = "models/resnet18.safetensors"
input_size = 224
good_vectors_path = "models/good_vectors.json"
train_dir = "data/visa_pcb1/train/good"
val_dir = "data/visa_pcb1/val/good"
test_dir = "data/visa_pcb1/test"
threshold_percentile = 80.0
uncertain_margin = 0.1
server_bind = "127.0.0.1:8080"
max_upload_bytes = 20971520
device = "cpu"
patch_bank_path = "models/patch_bank.safetensors"
patch_bank_size = 30000
patch_seed = 42
shift_percentile = 99.0
severity_low_max = 1.0
severity_med_max = 3.0
decisions_path = "data/decisions.jsonl"
web_dir = "web"
batches_dir = "data/batches"
max_batch_bytes = 2147483648
max_unpacked_bytes = 4294967296
max_batch_files = 5000
batch_workers = 5
thumb_size = 240
# Almost-black images (such as dataset mask files) are reported as errors instead of judged.
min_mean_brightness = 10.0
# Every trained folder in products_dir is a product; the model above is shown as default_product.
products_dir = "models/products"
default_product = "pcb1"
# A photo farther than this multiple of the closest product's limit is "unknown product".
unknown_ratio = 3.0
# Camera mode: teach a product by filming it, then inspect it live.
captures_dir = "data/captures"
camera_min_frames = 20
camera_val_every = 5
camera_threshold_percentile = 100.0
camera_threshold_slack = 1.2
camera_patch_bank_size = 15000
# The camera page records this many frames to learn an object.
camera_learn_frames = 90
# Live anomaly: a spot of at least this many patches, ignoring this many patches around the frame.
camera_min_spot_cells = 4
camera_edge_cells = 1
robustness_sample = 50

# Photo changes used by `prometheus-x robustness`.
[[perturbations]]
name = "darker"
kind = "brightness"
amount = -60.0

[[perturbations]]
name = "brighter"
kind = "brightness"
amount = 60.0

[[perturbations]]
name = "low contrast"
kind = "contrast"
amount = -40.0

[[perturbations]]
name = "blurry"
kind = "blur"
amount = 3.0

[[perturbations]]
name = "colour cast"
kind = "hue"
amount = 40.0
